name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TVLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::TVLOCK_KEYSTORE_BASE64 secret is not set; building a debug APK with a throwaway key instead."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tvlock.p12"
          echo "TVLOCK_KEYSTORE=$RUNNER_TEMP/tvlock.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          TVLOCK_KEYSTORE_PASSWORD: ${{ secrets.TVLOCK_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$TVLOCK_KEYSTORE" ]; then
            ./gradlew assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk tvlock.apk
          else
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk tvlock.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tvlock-apk
          path: tvlock.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tvlock.apk
